<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahi Mirror App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&display=swap">
<style>
/* Layout: a demo rail on the left and a 390x844 phone on the right; on a real phone the app fills the screen and the rail becomes a sheet.
   Palette: after-the-close dusk. Teal-ink accent for actions, tinted neutrals, flags in neutral chips (never red). */
:root {
  --stage: #D6DEDB;
  --bg: #F1F4F3;
  --surface: #FFFFFF;
  --surface-2: #E8EDEB;
  --ink: #13201E;
  --ink-2: #4A5856;
  --ink-3: #75837F;
  --line: #D9E1DE;
  --accent: #0C6A63;
  --accent-ink: #FFFFFF;
  --accent-soft: #D6EDE9;
  --chip: #E5EBE9;
  --chip-ink: #2A3836;
  --up: #2C8A5F;
  --down: #BF5640;
  --stop: #8C6B12;
  --mask: rgba(19, 32, 30, .045);
  --hatch: rgba(19, 32, 30, .10);
  --scrim: rgba(8, 14, 13, .45);
  --warn-bg: #FBF0D3;
  --warn-ink: #5A4204;
  --danger: #B3261E;
  --device: #0B0F0E;
  --lock-a: #1C3A37;
  --lock-b: #0B1514;
  --font-ui: 'Onest', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-display: 'Newsreader', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #070B0A; --bg: #0C1211; --surface: #141C1B; --surface-2: #1B2524; --ink: #E3EBE9; --ink-2: #A4B2AF; --ink-3: #6F7E7B; --line: #24302E;
    --accent: #5CC1B6; --accent-ink: #04211E; --accent-soft: #15332F; --chip: #213029; --chip-ink: #CFDBD8;
    --up: #4DB488; --down: #E07B63; --stop: #D4B45C; --mask: rgba(227, 235, 233, .035); --hatch: rgba(227, 235, 233, .09); --scrim: rgba(0, 0, 0, .62);
    --warn-bg: #362D14; --warn-ink: #F0D78E; --danger: #F28A80; --device: #000; --lock-a: #17302D; --lock-b: #050909;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #070B0A; --bg: #0C1211; --surface: #141C1B; --surface-2: #1B2524; --ink: #E3EBE9; --ink-2: #A4B2AF; --ink-3: #6F7E7B; --line: #24302E;
  --accent: #5CC1B6; --accent-ink: #04211E; --accent-soft: #15332F; --chip: #213029; --chip-ink: #CFDBD8;
  --up: #4DB488; --down: #E07B63; --stop: #D4B45C; --mask: rgba(227, 235, 233, .035); --hatch: rgba(227, 235, 233, .09); --scrim: rgba(0, 0, 0, .62);
  --warn-bg: #362D14; --warn-ink: #F0D78E; --danger: #F28A80; --device: #000; --lock-a: #17302D; --lock-b: #050909;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--stage); color: var(--ink); font: 14px/1.42 var(--font-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- stage ---------- */
.stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 44px; padding-block: 20px; padding-inline: 24px; }
.demo { width: 300px; flex: none; align-self: stretch; display: flex; flex-direction: column; gap: 18px; max-height: calc(100vh - 40px); overflow-y: auto; padding-right: 4px; }
.demo h1 { font: 500 26px/1.1 var(--font-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.demo .lede { margin: 6px 0 0; color: var(--ink-2); font-size: 13px; }
.dgroup { display: flex; flex-direction: column; gap: 8px; }
.dgroup > .dlabel { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.dseg { display: flex; flex-wrap: wrap; gap: 6px; }
.dseg button { padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--ink-2); }
.dseg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dnote { font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; }
.djump { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.djump button { padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; display: flex; gap: 6px; align-items: baseline; }
.djump button b { font-weight: 600; color: var(--accent); font-size: 11px; min-width: 20px; }
.dbtn { padding: 9px 12px; border-radius: var(--r-sm); background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13px; text-align: center; }
.dbtn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
.dfoot { font-size: 11.5px; color: var(--ink-3); }
.demo-fab { display: none; }
.device-wrap { flex: none; position: relative; }
.device { width: 414px; height: 868px; padding: 12px; border-radius: 58px; background: var(--device); box-shadow: 0 30px 80px -30px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.06); transform-origin: top left; position: absolute; top: 0; left: 0; }
.phone { position: relative; width: 100%; height: 100%; border-radius: 46px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; isolation: isolate; }

/* ---------- phone chrome ---------- */
.statusbar { height: 50px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 8px 36px; font-weight: 600; font-size: 15px; background: var(--surface); position: relative; z-index: 3; }
.statusbar .island { position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 112px; height: 32px; border-radius: 20px; background: #000; }
.statusbar .sys { display: flex; gap: 6px; align-items: center; }
.statusbar svg { display: block; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.screens { flex: 1; min-height: 0; position: relative; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-top: 6px; position: relative; z-index: 3; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 500; color: var(--ink-3); padding: 2px 0 4px; position: relative; min-height: 48px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab .dot { position: absolute; top: 1px; left: calc(50% + 9px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
.home-ind { height: 26px; flex: none; background: var(--surface); display: flex; align-items: center; justify-content: center; position: relative; z-index: 3; }
.home-ind span { width: 134px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .85; }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.screen.enter { animation: slideIn .3s cubic-bezier(.2, .8, .2, 1); }
.screen.fade { animation: fadeIn .2s ease-out; }
@keyframes slideIn { from { transform: translateX(36%); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.content { padding: 4px 16px 28px; display: flex; flex-direction: column; gap: 22px; }

.nav { flex: none; background: var(--surface); border-bottom: 1px solid var(--line); padding: 6px 8px 10px; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 4px; min-height: 56px; }
.nav .back { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--accent); }
.nav .ttl { min-width: 0; text-align: center; }
.nav .ttl b { display: block; font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav .ttl span { display: block; font-size: 12px; color: var(--ink-3); }
.nav .right { min-width: 44px; display: flex; justify-content: flex-end; padding-right: 6px; }
.pill { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

.mhead { flex: none; background: var(--surface); border-bottom: 1px solid var(--line); padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
.mhead .row1 { display: flex; align-items: center; justify-content: space-between; }
.mhead h1 { margin: 0; font: 500 30px/1.1 var(--font-display); letter-spacing: -.01em; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); }
.iconbtn:active { background: var(--surface-2); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.seg button { padding: 7px 0; border-radius: 8px; font-weight: 600; font-size: 13.5px; text-align: center; color: var(--ink-2); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg.sm button { font-size: 12px; padding: 5px 0; }

.strip-wrap { display: flex; align-items: stretch; gap: 8px; margin: 0 -16px; padding: 12px 16px 0; }
.strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; scroll-padding: 0 8px; }
.strip::-webkit-scrollbar { display: none; }
.dchip { flex: none; width: 54px; padding: 7px 0 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 1px; }
.dchip small { font-size: 11px; color: var(--ink-3); }
.dchip b { font-size: 17px; font-weight: 600; }
.dchip i { width: 6px; height: 6px; border-radius: 50%; margin-top: 3px; background: transparent; border: 1.5px solid var(--ink-3); }
.dchip i.s-rev { background: var(--ink-3); }
.dchip i.s-plan { background: var(--up); border-color: var(--up); }
.dchip i.s-open { border-color: var(--accent); background: var(--accent); }
.dchip i.s-skip { border-style: dashed; }
.dchip i.s-none { border-color: transparent; background: var(--line); }
.dchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.dchip[aria-pressed="true"] small { color: inherit; opacity: .75; }
.dchip:disabled { opacity: .55; }
.dchip .opens { font-size: 9.5px; line-height: 1.1; text-align: center; color: var(--ink-3); margin-top: 2px; }
.calbtn { flex: none; width: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); }

/* ---------- cards and sections ---------- */
.card { background: var(--surface); border-radius: var(--r-md); border: 1px solid var(--line); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-h h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.quiet { color: var(--ink-3); font-size: 12px; }
.note { background: var(--warn-bg); color: var(--warn-ink); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13px; }

.daycard { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.daycard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.headline { margin: 0; font: 500 27px/1.12 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.headline em { font-style: italic; }
.vals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; border-top: 1px solid var(--line); padding-top: 12px; }
.vals div { min-width: 0; }
.vals dt { font-size: 11.5px; color: var(--ink-3); line-height: 1.25; }
.vals dd { margin: 3px 0 0; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.daycard .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.status { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 8px 3px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status.s-open { color: var(--accent); background: var(--accent-soft); }
.status.s-rev { color: var(--ink-2); background: var(--surface-2); }
.status.s-plan { color: var(--up); background: color-mix(in srgb, var(--up) 14%, transparent); }
.status.s-skip { color: var(--ink-3); border-color: var(--line); border-style: dashed; }
.status.s-skip::before { background: transparent; border: 1.5px dashed currentColor; width: 5px; height: 5px; }
.status.s-none { color: var(--ink-3); background: var(--surface-2); }

.fchip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 4px 10px 4px 8px; border-radius: 999px; background: var(--chip); color: var(--chip-ink); font-size: 12.5px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
.fchip svg { flex: none; opacity: .7; }
button.fchip:active { border-color: var(--line); }
.fchip.ro { cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.more { font-size: 12px; color: var(--ink-3); align-self: center; }

.tcard { width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.tcard .r1 { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.tcard .inst { font-weight: 600; font-size: 14.5px; min-width: 0; }
.tcard .sub { font-size: 12.5px; color: var(--ink-2); }
.tcard .r3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 30px; }
.hiddenline { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); }
.pnl { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

.list { list-style: none; margin: 0; padding: 0; overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.row { width: 100%; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 14px; min-height: 60px; }
.row .lead { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.row .lead small { display: block; font-size: 10.5px; color: var(--ink-3); font-weight: 500; }
.row .main { min-width: 0; }
.row .t { display: block; font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-3); margin-top: 2px; flex-wrap: wrap; }
.row .trail { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.row .trail .pnl { font-size: 13.5px; }
.row .trail .pnl.hid { color: var(--ink-3); font-weight: 500; }
.fcount { font-size: 11px; color: var(--chip-ink); background: var(--chip); border-radius: 999px; padding: 1px 7px; }

.rules { padding: 4px 14px; }
.rrow { padding: 12px 0; display: flex; flex-direction: column; gap: 4px; }
.rrow + .rrow { border-top: 1px solid var(--line); }
.rrow .rt { font-weight: 500; }
.rrow .rr { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.link { color: var(--accent); font-weight: 600; font-size: 13px; padding: 6px 0; align-self: flex-start; }

.firstrun { padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--accent-soft); border-color: transparent; }
.firstrun h3 { margin: 0; font: 500 21px/1.15 var(--font-display); }
.firstrun p { margin: 0; color: var(--ink-2); }
.firstrun .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.empty { padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h3 { margin: 0; font: 500 22px/1.2 var(--font-display); text-wrap: balance; }
.empty p { margin: 0; color: var(--ink-2); max-width: 30ch; }
.building { padding: 18px 16px; display: flex; gap: 12px; align-items: center; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- buttons ---------- */
.btn { min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.sm { min-height: 40px; font-size: 13.5px; padding: 0 14px; border-radius: 12px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.tertiary { color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.full { width: 100%; }
.btn:disabled { opacity: .45; }
.btn .sub { font-weight: 500; font-size: 12px; opacity: .8; }
.btn.stack { flex-direction: column; gap: 0; line-height: 1.2; padding: 6px 18px; }

.sticky { flex: none; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 4px; }
.sticky .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.sticky .helper { font-size: 12px; color: var(--ink-3); text-align: center; }

/* ---------- trade reflection ---------- */
.chartp { background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
.chartp .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.chartp .seg { width: 190px; }
.chartp .legend { font-size: 11.5px; color: var(--ink-3); }
.chart { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg { display: block; width: 100%; height: auto; }
.cu { fill: var(--up); } .cd { fill: var(--down); }
.wu { stroke: var(--up); } .wd { stroke: var(--down); }
.cgrid { stroke: var(--line); stroke-width: 1; }
.ct { fill: var(--ink-3); font: 500 9.5px var(--font-ui); font-variant-numeric: tabular-nums; }
.cstop { stroke: var(--stop); stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; }
.cstopt { fill: var(--stop); font: 600 9.5px var(--font-ui); }
.cmark { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.cmark2 { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.cmt { fill: var(--ink); font: 600 10px var(--font-ui); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.cmtbg { fill: var(--surface); opacity: .85; }
.cmask { fill: var(--mask); }
.chatch { stroke: var(--hatch); stroke-width: 1; }
.cmaskt { fill: var(--ink-2); font: 500 11px var(--font-ui); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.cdiam { fill: var(--stop); stroke: var(--surface); stroke-width: 1.5; }
.cx { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 2; }
.ctip { position: absolute; top: 0; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 6px; pointer-events: none; white-space: nowrap; font-variant-numeric: tabular-nums; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 0; }
.facts div { padding: 10px 14px; min-width: 0; }
.facts div:nth-child(n+3) { border-top: 1px solid var(--line); }
.facts div:nth-child(odd) { border-right: 1px solid var(--line); }
.facts dt { font-size: 11.5px; color: var(--ink-3); }
.facts dd { margin: 2px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.facts .new { animation: reveal .5s ease-out both; }
@keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.recall { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.recall h2 { margin: 0; font: 500 24px/1.15 var(--font-display); text-wrap: balance; }
.rchips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rchip { min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px 6px; text-align: center; }
.rchip small { font-size: 10px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
.rchip[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }

<script>
'use strict';
/* =========================================================================

// ---------- utilities ----------
const $ = (s, r = document) => r.querySelector(s);

function gauss(r) { let u = 0, v = 0; while (u === 0) u = r(); while (v === 0) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const r05 = p => Math.round(p * 20) / 20;
const MINUS = '−';
const nf0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });

function tm(min) { const h = Math.floor(min / 60), m = min % 60; return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h >= 12 ? 'pm' : 'am'); }
function tmParts(min) { const s = tm(min).split(' '); return { t: s[0], ap: s[1] }; }
const hm = (h, m) => h * 60 + m;
const minWord = n => (n === 1 ? '1 minute' : n + ' minutes');
function dur(m) { if (m < 60) return m + ' min'; const h = Math.floor(m / 60), r = m % 60; return h + ' hr' + (r ? ' ' + r + ' min' : ''); }

const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function mkTrade(id, date, inst, side, size, entryMin, entry, exitMin, exit, exitKind, origin, stops, event) {
  const t = { id, date, inst, side, entryMin, entry, exitMin, exit, exitKind, origin, stops: stops || [], event: event || null };
  if (inst.type === 'opt') { t.lots = size; t.qty = size * inst.lot; } else { t.qty = size; t.lots = null; }

}

// Flags are computed from order facts with the default thresholds (Section 10.3). Past days keep these flags.
const FLAG_ORDER = ['revenge', 'widened', 'nostop', 'size', 'burst', 'opening', 'event'];
const FLAG_NAME = { revenge: 'Revenge entry', size: 'Size spike', nostop: 'No stop', widened: 'Stop widened or removed', opening: 'Opening rush', burst: 'Trade burst', event: 'Event exposure' };
const MISMATCH = ['revenge', 'widened', 'nostop', 'size', 'burst'];
const DEF = { revenge: 5, size: 2, nostop: 1, opening: 570, burstN: 3, burstM: 10 };
function computeFlags(trades) {
  trades.sort((a, b) => a.entryMin - b.entryMin);
  trades.forEach(t => {
    const f = [], facts = {};
    let loss = null;
    trades.forEach(o => { if (o !== t && o.net < 0 && o.exitMin <= t.entryMin && (!loss || o.exitMin > loss.exitMin)) loss = o; });
    if (loss && t.entryMin - loss.exitMin <= DEF.revenge) { f.push('revenge'); facts.gap = Math.max(1, t.entryMin - loss.exitMin); facts.prevLoss = loss.net; }
    facts.sizeX = sizeX(t); if (facts.sizeX >= DEF.size) f.push('size');
    const placed = t.stops.find(s => s.kind === 'place');
    if (!placed || placed.min - t.entryMin > DEF.nostop) f.push('nostop');
    if (t.stops.some(s => (s.kind === 'move' || s.kind === 'cancel') && s.inLoss)) f.push('widened');
    if (t.entryMin < DEF.opening) f.push('opening');
    const burst = trades.filter(o => o.entryMin <= t.entryMin && o.entryMin > t.entryMin - DEF.burstM);
    if (burst.length >= DEF.burstN) { f.push('burst'); facts.burstN = burst.length; facts.burstM = Math.max(1, t.entryMin - burst[0].entryMin); }
    if (t.event) f.push('event');
    t.flags = FLAG_ORDER.filter(k => f.includes(k));
    t.facts = facts;
  });
  return trades;
}

// Generated history for earlier days, seeded by date so it is the same on every load.
const DAY_KIND = { '2026-10-09': 'plan', '2026-10-07': 'none', '2026-09-30': 'plan', '2026-09-18': 'none' };

    else if (!plan && prev.net < 0 && r() < 0.5) { entryMin = prev.exitMin + 1 + Math.floor(r() * 4); intents++; }
    else if (!plan && r() < 0.07) { entryMin = prev.entryMin + 2 + Math.floor(r() * 3); intents++; }

    const spike = !plan && r() < 0.15; if (spike) intents++;

    else if (u < 0.86) { inst = mkOpt('BANKNIFTY', date, Math.round(spot * 2.25 / 100) * 100 + (Math.floor(r() * 5) - 2) * 100, r() < 0.5 ? 'CE' : 'PE'); entry = r05(180 + r() * 260); size = spike ? 2 : 1; }
    else { const sym = pick(r, Object.keys(EQ_PX)); inst = mkEq(sym); entry = r05(EQ_PX[sym] * (1 + (r() - 0.5) * 0.04)); side = r() < 0.5 ? 'Buy' : 'Sell'; size = spike ? 300 : pick(r, [100, 150, 200]); }

    const stop1 = r05(entry - dir * dist);

    let exit, exitKind = 'manual', exitMin = Math.min(entryMin + hold, hm(15, 20));

        stops.push({ min: mm, price: stop2, kind: 'move', inLoss: true, mkt: r05(stop1 + dir * dist * 0.15) });

    const origin = opt ? pick(r, ['Option chain', 'Option chain', 'Chart', 'Chart', 'Scanner', 'Watchlist', 'Basket']) : pick(r, ['Watchlist', 'Chart', 'Scanner']);
    prev = mkTrade('t-' + date.slice(5) + '-' + (i + 1), date, inst, side, size, entryMin, entry, exitMin, Math.max(0.05, exit), exitKind, origin, stops, event);

}

// ---------- day model ----------
const dayCache = {};
function dayTrades(date) {

  return dayCache[key];
}
function tradeById(id) {

}

  const top = flagged.slice(0, 3);

  return top.map(t => t.id);
}

}

const STATUS_TEXT = { open: 'Not reviewed', rev: 'Reviewed', plan: 'Followed plan', skip: 'Skipped', none: 'No trades', pending: 'Not ready' };
const statusChip = s => `<span class="status s-${s}">${STATUS_TEXT[s]}</span>`;

// Seeded reflections for past days (so history looks lived in).
function seedReflections() {
  const reviews = {}, skipped = {};
  const force = { '2026-10-08': 'rev', '2026-10-06': 'skip', '2026-10-05': 'rev', '2026-10-01': 'open', '2026-10-09': 'rev' };
  TRADING_DAYS.forEach(d => {

    const r = rng(hashStr('seed' + d));

    el.addEventListener('pointerdown', ev => { timer = setTimeout(() => { active = true; show(ev); }, ev.pointerType === 'mouse' ? 0 : 280); });
    el.addEventListener('pointermove', ev => { if (active || ev.pointerType === 'mouse' && ev.buttons) { active = true; show(ev); } });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(e => el.addEventListener(e, hide));
  });
}

function didList(t) {

  t.stops.filter(s => s.kind !== 'place').forEach(s => out.push({ time: tm(s.min), text: s.kind === 'move' ? `Stop moved to ${pxS(s.price)}${s.inLoss ? ' while in loss' : ''}` : 'Stop cancelled while in loss', key: !!s.inLoss }));

}

  }).join('')}</section>`;

  if (!state.rules.length) body += `<div class="card empty"><p>No rules yet. Add one from any pattern or trade.</p></div>`;

  body += `</section>`;

}

    <button type="button" class="notif" data-act="openPush"><span class="appic">S</span><span><span class="nh"><span>SAHI · MIRROR</span><span>now</span></span><span class="nt">Your Mirror is ready</span><span class="nb">${esc(pushBody())}</span></span></button>
    <div class="lfoot"><span>Tap the notification to open Mirror</span><button type="button" class="clear" data-act="clearPush">Swipe away</button></div></div>`;

// ---------- render ----------

  lastKey = key; lastLen = len;
  const showBanner = bannerVisible(); const bAnim = showBanner && !state.bannerShown ? ' anim' : ''; state.bannerShown = showBanner;
  const banner = showBanner ? `<div class="banner${bAnim}" role="status"><span><b>Your Mirror for today is ready.</b><span>${(() => { const m = dayMeta(TODAY); return m.flags ? `${m.worth.length} ${m.worth.length === 1 ? 'trade' : 'trades'} worth a look.` : 'You followed your plan today.'; })()}</span></span><button type="button" class="open" data-act="openBanner">Open Mirror</button><button type="button" class="x" data-act="dismissBanner" aria-label="Dismiss">${I.x}</button></div>` : '';

  editRule(el) { const r = state.rules.find(x => x.id === el.dataset.id); state.sheet = { type: 'rule', mode: 'edit', flag: r.flag, ruleId: r.id, value: r.value, orig: r.value, fresh: !state.sheet }; },
  ruleStep(el) { const sh = state.sheet, d = RULE_DEF[sh.flag]; sh.value = Math.min(d.max, Math.max(d.min, Math.round((sh.value + Number(el.dataset.dir) * d.step) * 10) / 10)); },

document.getElementById('app').addEventListener('click', ev => {

  }

document.getElementById('app').addEventListener('change', ev => {

  const parse = v => { const [h, m] = v.split(':').map(Number); return h * 60 + m; };
  if (el.dataset.time) { const v = parse(el.value || '09:30'); const f = el.dataset.time; if (v >= 556 && v <= 630) { state.settings.flags[f].v = v; state.savedKey = 'f-' + f; } render(); }

  const seg = (act, cur, opts) => `<div class="dseg">${opts.map(([v, l]) => `<button type="button" data-demo="${act}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div>`;
  $('#demo').innerHTML = `
  <div><h1>Sahi Mirror</h1><p class="lede">Clickable app prototype of the post-market trade review. Sample data for Mon 12 Oct 2026; not a real account.</p></div>
  <div class="dgroup"><span class="dlabel">Phone clock</span>${seg('clock', state.clock, [['market', '11:20 am · market open'], ['building', '3:42 pm · building'], ['after', '4:05 pm · ready']])}</div>

    ${seg('perm', state.perm, [['unasked', 'Not asked'], ['granted', 'Allowed'], ['denied', 'Denied']])}</div>
  <div class="dgroup"><span class="dlabel">Connection and theme</span>${seg('online', String(state.online), [['true', 'Online'], ['false', 'Offline']])}${seg('theme', state.theme, [['auto', 'System'], ['light', 'Light'], ['dark', 'Dark']])}</div>
  <div class="dgroup"><span class="dlabel">Jump to a surface</span><div class="djump">
    ${[['S2', 'Day', 's2'], ['S3', 'Recall', 's3r'], ['S3', 'Revealed', 's3v'], ['S4', 'Patterns', 's4'], ['S6', 'Pattern trades', 's6'], ['S5', 'Settings', 's5'], ['B1', 'Make a rule', 'b1'], ['B3', 'Flag details', 'b3'], ['B4', 'Pick a day', 'b4'], ['M2', 'Delete all', 'm2'], ['N2', 'In-app banner', 'n2'], ['—', 'Reflect in Positions', 'pos']].map(([id, l, k]) => `<button type="button" data-demo="jump" data-v="${k}"><b>${id}</b>${l}</button>`).join('')}
  </div></div>

function applyTheme() { const r = document.documentElement; if (state.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', state.theme); }

function firstWorth() { const m = dayMeta(TODAY); return m.worth[0]; }
const J = {

  s5() { state.tab = 'mirror'; state.stacks.mirror = [{ s: 'mirror' }, { s: 'settings' }]; },

  b3() { J.s2(); state.sheet = { type: 'flag', flag: 'revenge', fresh: true }; },
  b4() { J.s2(); state.calMonth = currentDay().slice(0, 7); state.sheet = { type: 'day', fresh: true }; },
  m2() { J.s5(); state.alert = { type: 'delete', phase: 'idle', fresh: true }; },
  n2() { ensureAfter(); if (state.scenario === 'none') state.scenario = 'flagged'; state.bannerDismissed = false; state.todayOpened = false; state.settings.banner = true; state.tab = 'watchlist'; },

$('#demo').addEventListener('click', ev => {

function toggleDemo(open) { $('#demo').classList.toggle('open', open); $('#demoFab').setAttribute('aria-expanded', String(open)); $('#demoFab').textContent = open ? 'Close' : 'Demo'; }

// ---------- phone scaling ----------
function fit() {

  if (window.matchMedia('(max-width: 560px)').matches) { wrap.style.width = ''; wrap.style.height = ''; dev.style.transform = ''; return; }
  const s = Math.min(1, (window.innerHeight - 40) / 868, (window.innerWidth - 40) / 414);
