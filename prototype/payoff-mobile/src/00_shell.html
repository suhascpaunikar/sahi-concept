<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sahi Payoff">
<title>Sahi Payoff Mobile</title>
<style>
/*CSS*/
</style>
</head>
<body>
<div class="stage">
  <aside class="dev" id="dev" aria-label="Prototype controls"></aside>
  <div class="devwrap" id="devwrap"><div class="device" id="device">
    <div class="app" id="app" data-v="v1">
      <div class="tb">
        <button class="cb b-x" aria-label="Close chart">/*ICON_X*/</button>
        <button class="cb b-rot" aria-label="Rotate">/*ICON_ROT*/</button>
        <button class="cb b-ai" aria-label="Sahi AI">/*ICON_AI*/</button>
        <div class="tpills"><button class="tp clock" data-n="Clock">12:59:00</button><button class="tp pnl" data-n="P&amp;L">P&amp;L<b>₹0</b></button><button class="tp" data-n="Positions">Positions</button><button class="tp" data-n="Orders">Orders</button></div>
        <button class="cb b-more" aria-label="Quick action wheel settings">/*ICON_MORE*/</button>
      </div>
      <section class="card" id="card-idx" data-chart="idx" aria-label="NIFTY50 chart"></section>
      <div class="divider" id="divider" role="separator" aria-label="Chart split handle"><i></i></div>
      <section class="card" id="card-opt" data-chart="opt" aria-label="Option chart"></section>
      <button class="dock" id="dock" aria-label="Quick actions">/*ICON_DOCK*/</button>
      <div class="zones" id="zones"></div>
      <div class="ov" id="ov"><div class="dim"></div></div>
      <div class="study" id="study" role="status"></div>
      <div class="toast" id="toast" role="status"></div>
      <div class="touch" id="touch"></div>
      <div class="sr" id="sr" aria-live="polite"></div>
    </div>
  </div></div>
</div>
<script>
/*JS*/
</script>
<style>
/*FONTS*/
</style>
</body>
</html>
