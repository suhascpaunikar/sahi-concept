<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sahi Payoff">
<title>Sahi Payoff Mobile</title>
<style>
/* =========================================================================
   Stage: phone frame on desktop, full screen on a phone
   ========================================================================= */
html, body { margin: 0; height: 100%; background: #0b0b0c; }
body { font-family: InterQW, Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8e8ea; -webkit-font-smoothing: antialiased; }
.stage { display: flex; gap: 28px; align-items: flex-start; justify-content: center; padding: 20px 24px; box-sizing: border-box; min-height: 100%; }
.device { position: relative; flex: none; padding: 9px; border-radius: 48px; background: #1b1b1d; box-shadow: 0 0 0 1px #2c2c30, 0 30px 90px rgba(0,0,0,.65); transform-origin: top left; }
.devwrap { position: relative; flex: none; }

/* =========================================================================
   App root. Every size below is in CSS px of the 412 x 915 reference frame.
   ========================================================================= */
.app {
  --sat: 48px; --sab: 12px; --fs: 1;
  position: relative; overflow: hidden; background: #000; color: #fff; border-radius: 40px;
  font: 400 14px/1.4 InterQW, Inter, system-ui, -apple-system, Roboto, sans-serif; letter-spacing: -.2px;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-synthesis: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none;
}
:where(.app) button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.app svg { display: block; flex: none; }
.app :focus-visible { outline: 2px solid #6aa8ff; outline-offset: 2px; }
.ico { stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ---- Top bar (y 56-88 on the reference frame) ---- */
.tb { position: absolute; left: 0; right: 0; top: calc(var(--sat) + 8px); height: 32px; z-index: 3; }
.cb { position: absolute; top: 0; width: 32px; height: 32px; border-radius: 16px; background: #272727; display: grid; place-items: center; }
.tb .b-x { left: 12px; } .tb .b-rot { left: 52px; } .tb .b-ai { left: 92px; color: #d84aa8; } .tb .b-more { right: 12px; }
.tpills { position: absolute; left: 132px; right: 44px; top: 0; height: 32px; display: flex; gap: 8.6px; overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent calc(100% - 6px)); mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent calc(100% - 6px)); }
.tp { flex: none; height: 32px; border-radius: 16px; background: #272727; padding: 0 7.5px; display: flex; align-items: center; font-size: 12px; white-space: nowrap; }
.tp.clock { font-size: 12px; font-feature-settings: "tnum"; letter-spacing: -.2px; }
.tp.pnl { font-size: 12.5px; font-weight: 500; letter-spacing: -.2px; }
.tp.pnl b { font-weight: 500; color: #3fd297; margin-left: 4px; }

/* ---- Chart cards ---- */
.card { position: absolute; left: 4px; right: 4px; background: #171717; border-radius: 16px; overflow: hidden; z-index: 1; }
.card canvas { position: absolute; left: 0; top: 0; }
.card.focus::after { content: ""; position: absolute; inset: 0; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); pointer-events: none; }
.hd { position: absolute; left: 0; right: 0; top: 0; height: 52px; z-index: 2; pointer-events: none; }
.hd > * { pointer-events: auto; }
.sym { position: absolute; left: 12px; top: 10.4px; height: 19.4px; display: flex; align-items: center; font-size: 14px; white-space: nowrap; max-width: calc(100% - 150px); }
.sym .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sym .ty, .sym .chv { flex: none; }
.sym .nm { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2.7px; letter-spacing: -.45px; font-feature-settings: "tnum"; }
.sym .ty { margin-left: 8.5px; }
.sym .chv { margin-left: 7.4px; margin-top: 1.2px; width: 12px; height: 12px; }
.pxl { position: absolute; left: 12px; top: 29.3px; height: 20px; display: flex; align-items: baseline; font-size: 14px; white-space: nowrap; font-feature-settings: "tnum"; letter-spacing: -.4px; }
.pxl .chg { font-size: 12px; font-weight: 500; margin-left: 3.4px; font-feature-settings: normal; letter-spacing: -.2px; }
.pxl .chg.dn { color: #ee7069; } .pxl .chg.up { color: #3fd297; }
.hdr { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; align-items: center; }
.lnk { width: 24px; height: 24px; border-radius: 12px; background: #353535; display: grid; place-items: center; color: #fff; }
.lnk.on { background: #fff; color: #000; }
.tfb { height: 24px; border-radius: 12px; background: #282828; display: flex; align-items: center; padding: 0 0 0 8.5px; font-size: 14px; white-space: nowrap; }
.tfb .sep { width: 1px; height: 11.4px; background: #424242; margin: 0 0 0 4.45px; }
.tfb .tfi { margin: 0 9.7px 0 4.55px; }
.tfb.held, .lnk.held { background: #3a3a3a; }
.tfb.active { background: #fff; color: #000; } .tfb.active .sep { background: #8a8a8a; }
.wm { position: absolute; left: 14px; width: 21px; height: 18px; pointer-events: none; z-index: 2; }
.legend { position: absolute; left: 10px; top: 56px; z-index: 2; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
.lg { display: flex; align-items: center; gap: 6px; height: 18px; padding: 0 6px 0 4px; border-radius: 6px; background: rgba(23,23,23,.72); font-size: 11.5px; color: #c9c9c9; white-space: nowrap; width: max-content; }
.lg i { width: 8px; height: 2px; border-radius: 1px; }
.lg b { font-weight: 500; font-feature-settings: "tnum"; }
.cleantag { position: absolute; right: calc(var(--axw) + 8px); top: 58px; z-index: 2; height: 20px; padding: 0 8px; border-radius: 10px; background: #272727; font-size: 11px; color: #d6d6d6; display: none; align-items: center; gap: 5px; pointer-events: none; }
.card.clean .cleantag { display: flex; }
.banner { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); z-index: 3; height: 28px; padding: 0 6px 0 12px; border-radius: 14px; background: #2962ff; color: #fff; font-size: 12px; font-weight: 500; display: none; align-items: center; gap: 8px; white-space: nowrap; }
.banner.on { display: flex; }
.banner button { width: 20px; height: 20px; border-radius: 10px; background: rgba(255,255,255,.22); display: grid; place-items: center; }

/* anchors that only some placements use */
.cornerglyph { position: absolute; z-index: 2; width: 22px; height: 22px; display: none; place-items: center; color: #8d8d8d; pointer-events: none; }
.app[data-v="v2"] .cornerglyph { display: grid; }
.dock { position: absolute; z-index: 6; width: 44px; height: 44px; border-radius: 22px; background: #272727; box-shadow: 0 6px 18px rgba(0,0,0,.55), inset 0 0 0 1px #343434; display: none; place-items: center; color: #fff; }
.app[data-v="v5"] .dock { display: grid; }
.dock.held { background: #3a3a3a; }
.dock .dt { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); font-size: 9.5px; color: #bdbdbd; white-space: nowrap; letter-spacing: 0; text-shadow: 0 1px 2px #000; }

/* ---- Split divider ---- */
.divider { position: absolute; left: 0; right: 0; height: 16.5px; z-index: 2; display: grid; place-items: center; touch-action: none; }
.divider i { width: 35.5px; height: 2.4px; border-radius: 2px; background: #fff; transition: width .15s, background .15s; }
.divider.held i { width: 46px; background: #fff; }

/* ---- Scrim, popover, sheets ---- */
.layer { position: absolute; inset: 0; z-index: 50; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.7); opacity: 0; transition: opacity .2s; }
.layer.in .scrim { opacity: 1; }
.pop { position: absolute; background: #171717; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transform-origin: top right; transform: scale(.96); opacity: 0; transition: transform .18s cubic-bezier(.2,.8,.2,1), opacity .14s; }
.layer.in .pop { transform: none; opacity: 1; }
.pop .tiles { display: flex; gap: 7.5px; padding: 16px; flex: none; }
.tile { flex: 1; height: 44px; border-radius: 10px; background: #292929; display: flex; flex-direction: column; align-items: center; padding-top: 6.2px; box-sizing: border-box; font-size: 11px; line-height: 13px; }
.tile span { margin-top: 2.5px; }
.pop hr { flex: none; height: 1px; border: 0; margin: 0; background: #2c2c2c; }
.pop .scroll { flex: 1; overflow-y: auto; padding: 0 16px 28px; overscroll-behavior: contain; touch-action: pan-y;
  -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 92px), rgba(0,0,0,.12) calc(100% - 22px)); mask-image: linear-gradient(180deg, #000 calc(100% - 92px), rgba(0,0,0,.12) calc(100% - 22px)); }
.pop .scroll::-webkit-scrollbar { display: none; }
.sech { display: flex; justify-content: space-between; align-items: center; min-height: 20px; margin: 20.3px 0 16.7px; font-size: 14px; }
.sech.btn { min-height: 28px; }
.addi { display: flex; align-items: center; gap: 7.5px; height: 28px; font-size: 12.3px; font-weight: 500; padding-left: 2px; margin-right: 3.4px; transform: translateY(2.2px); }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; }
.chip { height: 32px; box-sizing: border-box; border-radius: 16px; border: 1px solid #2f2f2f; display: flex; align-items: center; justify-content: center; gap: 0; font-size: 14px; color: #b0b0b0; }
.chip.on { border: 1.5px solid #e6e6e6; color: #fff; font-weight: 600; justify-content: space-between; padding: 0 11.3px 0 27.5px; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #171717; border-radius: 16px 16px 0 0; transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; overflow: hidden; }
.layer.in .sheet { transform: none; }
.sh-title { position: relative; flex: none; height: 24px; margin: 27.7px 16px 0; font-size: 18px; font-weight: 600; line-height: 24px; display: flex; align-items: center; }
.sh-x { position: absolute; right: 12.5px; top: 19.4px; width: 40px; height: 40px; display: grid; place-items: center; }
.tabs { flex: none; position: relative; display: flex; gap: 25.5px; padding: 0 16px; height: 43.4px; margin-top: 5.4px; box-shadow: inset 0 -1px 0 #242424; overflow: hidden; }
.tab { font-size: 16px; color: #b2b2b2; height: 43.4px; box-sizing: border-box; padding-top: 9.3px; display: flex; align-items: flex-start; white-space: nowrap; position: relative; flex: none; }
.tab.on { color: #fff; font-weight: 600; }
.tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #fff; border-radius: 1px; }
.ctgrid { display: grid; grid-template-columns: 174px 174px; column-gap: 32px; padding: 15.3px 16px 0; }
.ctrow { height: 56px; display: flex; align-items: center; font-size: 14px; font-weight: 500; text-align: left; }
.ctrow .ci { width: 24px; height: 24px; margin-right: 13px; color: #fff; }
.ctrow .lbl { flex: 1; }
.radio { width: 20px; height: 20px; border-radius: 10px; box-sizing: border-box; border: 1.5px solid #9d9d9d; display: grid; place-items: center; }
.radio.on { border: 1.75px solid #fff; }
.radio.on::after { content: ""; width: 10.3px; height: 10.3px; border-radius: 6px; background: #fff; }
.sharebtn { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(28px + var(--sab)); height: 32.6px; border-radius: 16.3px; background: #353535; padding: 0 12.4px 0 9.5px; display: flex; align-items: center; gap: 8.6px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.tabpane { flex: 1; overflow-y: auto; }
.setrow { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 14px; }
.tog { width: 36px; height: 20px; border-radius: 10px; background: #3a3a3a; position: relative; transition: background .15s; flex: none; }
.tog::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 8px; background: #bdbdbd; transition: transform .15s, background .15s; }
.tog.on { background: #089981; } .tog.on::after { transform: translateX(16px); background: #fff; }

/* Add indicators sheet */
.ih { position: relative; flex: none; height: 24px; margin: 16.4px 16px 0; display: flex; align-items: center; }
.ih h3 { margin: 0; font-size: 18px; font-weight: 600; line-height: 24px; flex: 1; letter-spacing: -.2px; }
.ih .tpl { display: flex; align-items: center; gap: 4.6px; font-size: 14px; font-weight: 500; margin-right: 12.6px; }
.ih .vs { width: 1px; height: 16px; background: #313131; margin-right: 6px; }
.ih .sh-x { position: static; width: 32px; height: 32px; margin-right: -4px; }
.srch { flex: none; margin: 16px 12px 0; height: 40px; box-sizing: border-box; border: 1px solid #2e2e2e; border-radius: 12px; display: flex; align-items: center; padding-left: 10.7px; gap: 7px; color: #ababab; }
.srch input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: #fff; font: inherit; font-size: 14px; letter-spacing: -.2px; padding: 0; -webkit-user-select: text; user-select: text; }
.srch input::placeholder { color: #777; }
.itabs { flex: none; display: flex; gap: 24.5px; padding: 0 16px; height: 41px; margin-top: 4px; box-shadow: inset 0 -1px 0 #2e2e2e; overflow-x: auto; scrollbar-width: none; }
.itabs::-webkit-scrollbar { display: none; }
.itabs .tab { height: 41px; padding-top: 6.8px; }
.itabs .tab.on { font-size: 17px; padding-top: 6.2px; }
.ilist { flex: 1; overflow-y: auto; padding: 6.6px 0 calc(16px + var(--sab)); overscroll-behavior: contain; touch-action: pan-y; }
.irow { display: flex; align-items: center; min-height: 56.3px; padding: 0 22px 0 17.7px; box-sizing: border-box; }
.irow.two { min-height: 65.3px; }
.irow .add { width: 13.2px; height: 13.2px; border-radius: 7px; background: #43e097; display: grid; place-items: center; margin-right: 13.4px; flex: none; color: #0f0f0f; }
.irow.on .add { background: #fff; }
.irow .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.irow .t1 { font-size: 14px; font-weight: 500; line-height: 19px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.irow .t2 { font-size: 12px; color: #aeaeae; line-height: 17px; }
.irow .only { height: 16px; padding: 0 3px; border-radius: 8px; background: #262626; color: #ababab; font-size: 10.5px; font-weight: 500; display: flex; align-items: center; letter-spacing: 0; }
.irow .st { color: #fff; width: 16px; height: 16px; }
.irow .st.on { color: #f5c24b; fill: #f5c24b; }
.irow .onlbl { font-size: 11px; color: #43e097; margin-right: 10px; }

/* generic list sheet (Quick actions, menu) */
.lsheet .rows { flex: 1; overflow-y: auto; padding: 8px 0 calc(16px + var(--sab)); }
.qrow { display: flex; align-items: center; min-height: 56px; padding: 8px 16px; gap: 14px; font-size: calc(14px * var(--fs)); line-height: 1.3; width: 100%; text-align: left; box-sizing: border-box; }
.qrow:active { background: #202020; }
.qrow .qi { min-width: 36px; height: 36px; padding: 0 4px; box-sizing: border-box; border-radius: 10px; background: #272727; display: grid; place-items: center; flex: none; }
.qrow .qt { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-wrap: anywhere; }
.qrow .qt small { font-size: calc(12px * var(--fs)); color: #9e9e9e; margin-top: 1px; }
.qrow .qs { font-size: calc(12px * var(--fs)); flex: none; color: #9e9e9e; display: flex; align-items: center; gap: 6px; }
.qrow .qs.on { color: #43e097; }
.qrow[aria-disabled="true"] { opacity: .45; }
.qhead { display: flex; align-items: center; gap: 8px; margin: 8px 16px 4px; font-size: 12px; color: #9e9e9e; }
.qhead .chipx { height: 22px; padding: 0 10px; border-radius: 11px; background: #272727; color: #fff; display: flex; align-items: center; white-space: nowrap; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
.vrow { display: flex; align-items: center; gap: 12px; padding: 10px 16px; width: 100%; text-align: left; box-sizing: border-box; }
.vrow .vb { width: 52px; height: 52px; border-radius: 12px; background: #202020; flex: none; display: grid; place-items: center; }
.vrow .vt { flex: 1; min-width: 0; }
.vrow .vt b { display: block; font-size: 14px; font-weight: 500; }
.vrow .vt span { display: block; font-size: 12px; color: #9e9e9e; line-height: 16px; margin-top: 2px; }
.secl { font-size: 12px; color: #8a8a8a; margin: 14px 16px 4px; letter-spacing: 0; text-transform: none; }

/* drawing toolbar and range sheet */
.dtool { position: absolute; left: 8px; right: 8px; z-index: 4; height: 44px; border-radius: 14px; background: #202020; box-shadow: 0 8px 24px rgba(0,0,0,.5), inset 0 0 0 1px #2e2e2e; display: flex; align-items: center; gap: 2px; padding: 0 4px; }
.dtool button { width: 40px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #e6e6e6; }
.dtool button.on { background: #2962ff; color: #fff; }
.dtool .dsp { flex: 1; }
.rgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; padding: 16px; }

/* ---- Wheel overlay ---- */
.ov { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
.ov .dim { position: absolute; inset: 0; background: rgba(0,0,0,.42); opacity: 0; transition: opacity .12s; }
.ov.on .dim { opacity: 1; }
.ov svg.wheel { position: absolute; left: 0; top: 0; overflow: visible; }
.wheel .sec { fill: #1f1f1f; stroke: #000; stroke-width: 0; transition: fill .07s; }
.wheel .sec.cur { fill: #1f1f1f; }
.wheel .sec.hov { fill: #fff; }
.wheel .sec.na { fill: #161616; }
.wheel .lab { fill: #fff; font: 500 12.5px InterQW, Inter, system-ui, sans-serif; letter-spacing: -.2px; text-anchor: middle; dominant-baseline: middle; }
.wheel .cap { fill: #9e9e9e; font: 400 10px InterQW, Inter, system-ui, sans-serif; letter-spacing: 0; text-anchor: middle; dominant-baseline: middle; }
.wheel .cap.on { fill: #43e097; }
.wheel .hov .lab, .wheel g.hov .lab { fill: #000; }
.wheel g.hov .cap { fill: #3d3d3d; } .wheel g.hov .cap.on { fill: #067a63; }
.wheel g.hov .wi { stroke: #000; }
.wheel .wi { stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wheel g.na .lab, .wheel g.na .wi { opacity: .4; }
.wheel .hub { fill: #111; stroke: #3a3a3a; stroke-width: 1; }
.wheel .hubt { fill: #fff; font: 600 12px InterQW, Inter, system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; letter-spacing: -.2px; }
.wheel .hubs { fill: #a9a9a9; font: 400 10.5px InterQW, Inter, system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
.wheel .split { stroke: rgba(255,255,255,.28); stroke-width: 1; stroke-dasharray: 3 3; }
.wheel .ghost { fill: #fff; font: 400 14px InterQW, Inter, system-ui, sans-serif; letter-spacing: -.2px; dominant-baseline: middle; }
.wheel .sdot { fill: #43e097; }
.wheel g.hov .sdot { fill: #067a63; }
.wheel .scope { fill: #9e9e9e; font: 500 10px InterQW, Inter, system-ui, sans-serif; letter-spacing: .4px; text-anchor: middle; dominant-baseline: middle; }
.vpill { position: absolute; z-index: 41; box-sizing: border-box; min-height: 30px; padding: calc(6px * var(--fs)) 12px; border-radius: 15px; background: #fff; color: #000; font-size: calc(13px * var(--fs)); line-height: calc(18px * var(--fs)); font-weight: 600; letter-spacing: -.1px; box-shadow: 0 6px 20px rgba(0,0,0,.5); opacity: 0; transition: opacity .1s; pointer-events: none; width: max-content; }
.vpill .in { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.vpill .sc { font-weight: 500; color: #6a6a6a; margin-right: 6px; }
.vpill.muted .sc { color: #9a9a9a; }
.vpill.on { opacity: 1; }
.vpill.muted { background: #2a2a2a; color: #e6e6e6; font-weight: 500; }
.qlist { position: absolute; z-index: 41; width: 228px; border-radius: 16px; background: #171717; box-shadow: 0 14px 40px rgba(0,0,0,.6), inset 0 0 0 1px #262626; padding: 6px 0; transform-origin: top right; animation: qlin .14s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
@keyframes qlin { from { transform: scale(.94); opacity: 0; } }
.qlist .qh { font-size: 11px; color: #9e9e9e; padding: 6px 14px 6px; display: flex; justify-content: space-between; letter-spacing: 0; }
.qlist .qli { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: calc(14px * var(--fs)); }
.qlist .qli .qtf { min-width: 18px; flex: none; font-weight: 600; font-size: calc(13px * var(--fs)); }
.qlist.fit .qli .qn { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qlist .qli .ico { flex: none; }
.qlist .qli.hov { background: #fff; color: #000; }
.qlist .qli .s { margin-left: auto; font-size: calc(11px * var(--fs)); color: #9e9e9e; flex: none; }
.qlist .qli .s.on { color: #43e097; }
.qlist .qli.hov .s { color: #444; } .qlist .qli.hov .s.on { color: #067a63; }

  ['fibext', 'fib', 'Trend-Based Fib Extension', 'Fib ext'], ['text', 'pen', 'Text', 'Text'], ['ray', 'trend', 'Ray', 'Ray'], ['extline', 'trend', 'Extended Line', 'Ext line'],
  ['brush', 'pen', 'Brush', 'Brush'], ['circle', 'pen', 'Circle', 'Circle'], ['arrow', 'trend', 'Arrow', 'Arrow'], ['arrowup', 'pen', 'Arrow Up', 'Arrow up'],

const QV_DEF = { tf: ['1m', '15m'], tools: ['trend', 'fib'], inds: ['vwap', 'ema'], tpls: [] };

/* ---------- geometry helpers on the chart's slots ---------- */
function xAtT(g, T) {

/* ---------- pricing at the point ---------- */
function pointVals(b = book(), pt = PM.pt) {

/* ---------- breakevens: roots of the book's P&L per slot, cached per book version (BR-07) ---------- */

const PO_COL = { be: '#f0b93a', pt: '#7f9bff', up: 'rgba(8,153,129,.16)', dn: 'rgba(242,54,69,.11)', zone: 'rgba(255,255,255,.035)', strike: '#b0b6c3' };

/* =========================================================================
   Seller-panel look (from the Option Seller panel screenshots, 11 Nov 2026)
   - payBoxHTML: the payoff box, worded and styled like the seller panel's payoff-graph tooltip
   - renderSellerPanel: several positions (S3) in the seller panel's structure:
     title, Positions | Analyse tabs, leg cards, Max Loss / Max Profit / POP bar,
     Summary (premium, Greeks, breakeven) and Payoff graph (the point's time and Expiry date)
   Used when the improved Payoff is on (uxB); ?ux=a keeps the first Payoff list and readout.
   ========================================================================= */
const kfmt = n => { const a = Math.abs(n), s = Math.round(n) > 0 ? '+' : Math.round(n) < 0 ? '−' : ''; return `${s}₹${a >= 1e5 ? (a / 1e5).toFixed(2) + 'L' : a >= 1000 ? (a / 1000).toFixed(2) + 'K' : Math.round(a)}`; };
const pctTxt = p => `${p > 0.004 ? '+' : p < -0.004 ? '−' : ''}${Math.abs(p).toFixed(2)}%`;
const pctCls = p => p > 0.004 ? 'up' : p < -0.004 ? 'dn' : '';
// the expiry the "Expiry date" values use: the first one still ahead; none for an intraday-only book
function payExpT(b) {
  if (!b.legs.length || (!b.pretrade && b.legs.every(l => l.product === 'INTRADAY'))) return null;
  const now = MK.nowT(), xs = b.legs.filter(l => l.c.type !== 'FUT' && l.product !== 'INTRADAY' && l.c.expT > now).map(l => l.c.expT);
  const fx = b.legs.filter(l => l.c.type === 'FUT' && l.c.expT > now).map(l => l.c.expT);
  return xs.length ? Math.min(...xs) : fx.length ? Math.min(...fx) : null;
}
function boxWhen(T) { const { di, mod } = E.split(T); return di === E.TODAY ? `Today, ${E.clock(mod)}` : `${E.DAYS[di].label}, ${E.clock(mod)}`; }
// rows of the payoff box: the point's time, then the expiry date (one row when the point is at or past it)
function payRows(b, v) {
  const TE = payExpT(b);
  if (TE == null || v.T > TE + 1e-6) return [[boxWhen(v.T), v.pnl]];
  if (v.T >= TE - 1e-6) return [['Expiry date', v.pnl]];
  return [[boxWhen(v.T), v.pnl], ['Expiry date', PF.pnl(b, v.S, TE)]];
}
function payBoxHTML(b, v, extra = '') {
  const pct = (v.S - b.S0) / b.S0 * 100;
  return `<div class="bx1">When price is at</div><div class="bx2"><b>${v.S.toFixed(2)}</b> <span class="${pctCls(pct)}">${pctTxt(pct)}</span></div><div class="bx3">Expected P&amp;L on</div>${payRows(b, v).map(([k, n]) => `<div class="bx4">${k}: <b class="${pnlCls(n)}">${kfmt(n)}</b></div>`).join('')}${extra}`;
}

/* Three takes on the payoff box (S.box: a, b or c; 0 keeps the seller-panel box above). The crosshair already
   shows the level on the price axis and the time on the time axis, so each take leads with the expected P&L
   and leaves the level and the time to the axes. What stays is what the axes can't say: the same level at
   expiry, and how far that level is from the market now.
   a: the P&L as a headline. b: the point's time and the expiry as two aligned rows. c: a tag beside the point. */
function moveTxt(b, v) { const d = v.S - b.S0; return Math.abs(d) < 2.5 ? `${idxName()} unchanged` : `${idxName()} ${ptsTxt(d)} pts (${pctTxt(d / b.S0 * 100)})`; }
function payBoxV(b, v, extra = '') {
  const rows = payRows(b, v), atExp = rows[0][0] === 'Expiry date', exp = rows[1] ? rows[1][1] : null;
  const num = (n, cls = '') => `<b class="${cls} ${pnlCls(n)}">${sgn(n)}</b>`;
  if (S.box === 'c') return `<div class="bn ${pnlCls(v.pnl)}">${sgn(v.pnl)}</div>${exp != null ? `<div class="bm">Expiry ${num(exp)}</div>` : atExp ? '<div class="bm">at expiry</div>' : ''}${extra}`;
  const head = `<div class="bl">Expected P&amp;L${atExp ? ' at expiry' : ''}</div>`, foot = `<div class="bm">${moveTxt(b, v)}</div>${extra}`;
  if (S.box === 'b') return `${head}<div class="bg"><span class="p">${atExp ? 'Expiry' : ptTimeShort(v.T)}</span>${num(v.pnl, 'p')}${exp != null ? `<span>Expiry</span>${num(exp)}` : ''}</div>${foot}`;
  return `${head}<div class="bn ${pnlCls(v.pnl)}">${sgn(v.pnl)}</div>${exp != null ? `<div class="bs">At expiry ${num(exp)}</div>` : ''}${foot}`;
}

/* ---------- numbers for the Summary ---------- */
const ncdf = x => { const t = 1 / (1 + .2316419 * Math.abs(x)), d = .3989423 * Math.exp(-x * x / 2), p = d * t * (.3193815 + t * (-.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; };
function panelStats(b) {
  const now = MK.nowT(), S0 = b.S0, key = `${PM.ver}|${Math.round(now)}|${Math.round(S0)}`;
  if (PM.statC && PM.statC.key === key) return PM.statC;
  const TE = payExpT(b) ?? PF.axisEnd(b), f = S => PF.pnl(b, S, TE), o = { key, TE };
  // max profit and max loss at the expiry: open-ended when the payoff still slopes far above the market
  const strikes = b.legs.filter(l => l.c.type !== 'FUT').map(l => l.c.strike), pts = [1, ...strikes, 2 * S0];
  for (let S = S0 * .7; S <= S0 * 1.3; S += 25) pts.push(S);
  const vals = pts.map(f), slope = f(2 * S0) - f(2 * S0 - 100);
  // a payoff that still slopes far below the market (a sold or bought put on its own) counts as open-ended too
  const low = f(S0 * .5) - f(S0 * .5 + 100);
  o.maxP = slope > 1 || low > 1 ? Infinity : Math.max(...vals); o.maxL = slope < -1 || low < -1 ? -Infinity : Math.min(...vals);
  // POP: the chance the book is in profit at that expiry, on a lognormal spread at the at-the-money IV
  const tau = E.tauOf(TE, now), sd = E.baseIv() * Math.sqrt(tau);
  if (sd < 1e-6) o.pop = f(S0) > 0 ? 100 : 0;
  else { const cdf = x => ncdf((Math.log(x / S0) + sd * sd / 2) / sd); let p = 0, x0 = S0 * .5, c0 = cdf(x0); if (f(x0) > 0) p += c0; for (let x = x0 + 10; x <= S0 * 1.5; x += 10) { const c1 = cdf(x); if (f(x - 5) > 0) p += c1 - c0; c0 = c1; } if (f(S0 * 1.5) > 0) p += 1 - c0; o.pop = Math.round(p * 100); }
  // position Greeks now: per index point, per session, per IV point
  let dl = 0, th = 0, ga = 0, ve = 0;
  for (const l of b.legs) {
    const q = l.side * l.qty, c = l.c;
    if (c.type === 'FUT') { dl += q; continue; }
    if (c.expT <= now || (l.product === 'INTRADAY' && now >= PF.SQ_T)) continue;
    const p0 = E.price(c, S0, now), up = E.price(c, S0 + 1, now), dn = E.price(c, S0 - 1, now);
    dl += q * (up - dn) / 2; ga += q * (up - 2 * p0 + dn); th += q * (E.price(c, S0, Math.min(c.expT, now + E.SESSION)) - p0); ve += q * (E.price(c, S0, now, .01) - p0);
  }
  Object.assign(o, { delta: dl, theta: th, gamma: ga, vega: ve });
  const opts = b.legs.filter(l => l.c.type !== 'FUT');
  o.net = opts.reduce((a, l) => a + l.side * l.qty * l.avg, 0); o.unit = opts.length ? o.net / Math.max(...opts.map(l => l.qty)) : 0;
  o.pnlNow = PF.pnl(b, S0, now);
  PM.cache.delete(TE); o.be = slotRoots(b, TE).roots.slice();
  return PM.statC = o;
}
const statBar = st => `<div class="spstat"><span><i>Max Loss</i><b class="dn">${st.maxL === -Infinity ? 'Unlimited' : E.rupees(Math.round(Math.abs(Math.min(0, st.maxL))))}</b></span><span><i>Max Profit</i><b class="up">${st.maxP === Infinity ? 'Unlimited' : E.rupees(Math.round(Math.max(0, st.maxP)))}</b></span><span><i>POP</i><b>${st.pop}%</b></span></div>`;
const beTxt = (st, b) => st.be.length ? st.be.map(x => `${x.toFixed(2)} (${pctTxt((x - b.S0) / b.S0 * 100)})`).join('  ·  ') : 'None in range';
const SP_IC = { min: '<path d="M14.5 3.5v6h6M9.5 20.5v-6h-6"/>', max: '<path d="M20.5 9.5v-6h-6M3.5 14.5v6h6"/>', ok: '<path d="m5 12.5 4.5 4.5L19 7.5"/>' };
const spIc = (k, s = 16, w = 2) => `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SP_IC[k]}</svg>`;

/* ---------- Payoff graph: P&L against the index level, at the point's time and at the expiry ---------- */
function niceStep(span, n) { const raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
const axK = v => Math.abs(v) < 1e-9 ? '0' : `${v > 0 ? '+' : '−'}${Math.abs(v) >= 1000 ? +(Math.abs(v) / 1000).toFixed(1) + 'K' : Math.round(Math.abs(v))}`;

    <div class="secl">Try it</div>
    <button class="qrow" data-a="q1"><span class="qi">${ic('dots3', 18, 1.8)}</span><span class="qt">Quick actions sheet<small>The same actions without the gesture</small></span></button>
    <button class="qrow" data-a="picks"><span class="qi">${ic('flash', 18, 1.8)}</span><span class="qt">Reset quick action picks<small>1m, 15m, Trend Line, Fib, VWAP, EMA 20, no templates</small></span></button>
    <button class="qrow" data-a="reset"><span class="qi">${ic('trash', 18, 1.8)}</span><span class="qt">Reset charts<small>5m, no indicators, no drawings</small></span></button></div></div>`);
  const layer = openLayer(sh, { label: 'Prototype settings' });
  bindPayoffDev(sh, () => layer.close('picked'));
  sh.addEventListener('click', e => {
    if (e.target.closest('.sh-x')) return layer.close('close');
    if (e.target.closest('.pdev')) return;
    const qb = e.target.closest('[data-qa]'); if (qb) { setQa(qb.dataset.qa); $$('[data-qa]', sh).forEach(b => b.classList.toggle('on', b === qb)); return; }
    const fb = e.target.closest('[data-fs]'); if (fb) { setTextSize(+fb.dataset.fs); $$('[data-fs]', sh).forEach(b => b.classList.toggle('on', b === fb)); return; }
    const o = e.target.closest('.setrow'); if (o) { const k = o.dataset.o; S[k] = !S[k]; $('.tog', o).classList.toggle('on', S[k]); syncDev(); return; }
    const a = e.target.closest('[data-a]'); if (!a) return; layer.close('picked');
    setTimeout(() => ({ q1: () => openQ1(S.focus, 'menu'), picks: () => { resetQuick(); toast('Quick action picks reset'); }, reset: () => { resetCharts(); toast('Charts reset'); } })[a.dataset.a](), 280);
  });
}
function setTextSize(f, { silent = false } = {}) {
  cancelGesture('invalid_context');
  S.fs = TEXT_SIZES.includes(f) ? f : 1; app.style.setProperty('--fs', S.fs);
  syncDev();
  if (!silent) track('text_size', { to: S.fs });
}
// the quick action panel's layout: pills in titled sections, or the list
function setQa(v, { silent = false } = {}) {
  cancelGesture('invalid_context');
  S.qa = QA_LAYOUTS.some(q => q[0] === v) ? v : 'pills3'; store.set('qa2', S.qa); rebuildSlots(); syncDev();
  if (!silent) track('qa_layout', { to: S.qa });
}
let coachEl = null;
function showCoach(force = false) {
  dismissCoach(true);
  if (sstore.get('coach', false) && !force) return;
  const r = rectIn($('.tfb', CH.opt.el)), a = { x: r.x + r.w / 2, y: r.y + r.h };
  coachEl = h(`<div class="coach" role="note"><b>Quick actions on the timeframe button</b>Hold ${CH.opt.tf}, slide to an action, release. A tap opens the chart menu.<div class="cbtns"><button data-c="ok">Got it</button></div></div>`);
  app.appendChild(coachEl);
  const w = coachEl.offsetWidth, hh = coachEl.offsetHeight, x = clamp(a.x - w / 2, 10, L.W - w - 10);
  coachEl.style.left = x + 'px'; coachEl.style.top = clamp(a.y + 12, L.sat + 4, L.H - hh - 8) + 'px';
  coachEl.style.setProperty('--ax', clamp(a.x - x, 18, w - 18) + 'px'); coachEl.style.setProperty('--ay', '-5px');
  coachEl.addEventListener('click', e => { if (e.target.closest('[data-c]')) dismissCoach(); });
}
function dismissCoach(soft = false) { if (!coachEl) return; coachEl.remove(); coachEl = null; if (!soft) { sstore.set('coach', true); setTimeout(() => showPayoffTip(), 500); } }
function copyJSON(obj) { const s = JSON.stringify(obj, null, 2); (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(() => toast('Copied'), () => { const t = document.createElement('textarea'); t.value = s; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('Copied'); } catch { toast('Copy failed'); } t.remove(); }); }
function resetCharts(quiet) {
  if (PM.on) setPayoff(false, { source: 'reset' });
  for (const id of CHART_IDS) { const c = CH[id]; Object.assign(c, { tf: '5m', type: 'candle', ind: {}, draws: [], draft: null, ys: null, cross: null, spacing: BASE[id].spacing, ro: BASE[id].ro, _ic: {}, _rk: null }); }
  S.linked = false; $$('.dtool').forEach(x => x.remove()); updateHeaders(); redraw();
}

function buildDev() {
  const dev = $('#dev'); if (!dev) return;
  dev.innerHTML = `
    <div><h1>Sahi Payoff · mobile</h1></div>
    <div class="sub">Tap Payoff in the index chart's header, then tap, drag or long-press in the shaded area. Hold a timeframe button for the quick action panel; tap it for the chart menu, where the flash icons choose the panel's actions. PRD in docs/sahi-payoff-mobile-prd.md.</div>
    <div class="box"><h2>Payoff demo</h2>${payoffDevHTML()}</div>
    <div class="box"><h2>Quick actions</h2><div class="seg" id="qas">${QA_LAYOUTS.map(([k, n]) => `<button data-qa="${k}">${n}</button>`).join('')}</div>
      <div class="seg" id="lfs" style="margin-top:6px">${TEXT_SIZES.map(f => `<button data-fs="${f}">${Math.round(f * 100)}% text</button>`).join('')}</div>
      <div style="display:flex;gap:6px;margin-top:10px"><button class="dbtn" data-d="q1">Quick actions sheet</button><button class="dbtn" data-d="picks">Reset picks</button><button class="dbtn" data-d="coach">Coach mark</button></div></div>
    <div class="box"><h2>Phone</h2><div class="seg" id="frames">${Object.entries(FRAMES).map(([k, f]) => `<button data-f="${k}" title="${f.note}">${f.label}</button>`).join('')}</div></div>
    <div class="box"><h2>Options</h2>
      <label class="dt">Show touches<input type="checkbox" data-t="touches"></label>
      <label class="dt">Haptics (vibration, iOS tick)<input type="checkbox" data-t="haptics"></label>
      <label class="dt">Sound ticks (desktop stand-in for haptics)<input type="checkbox" data-t="sound"></label>
      <div class="hmeter" style="margin-top:6px"><i id="hDot"></i><span id="hTxt">${Haptic.canVibrate ? 'Vibration API available' : 'No Vibration API here: optional sound stands in'}</span></div></div>
    <div class="box"><h2>Event log</h2><ul class="log" id="log"></ul><div style="display:flex;gap:6px;margin-top:8px"><button class="dbtn" data-d="copylog">Copy JSON</button><button class="dbtn" data-d="reset">Reset charts</button></div></div>`;
  dev.addEventListener('click', e => {
    const fb = e.target.closest('[data-f]'); if (fb) { S.frame = fb.dataset.f; relayout(); syncDev(); return; }
    const qb = e.target.closest('[data-qa]'); if (qb) return setQa(qb.dataset.qa);
    const zb = e.target.closest('[data-fs]'); if (zb) return setTextSize(+zb.dataset.fs);
    const d = e.target.closest('[data-d]'); if (!d) return;
    ({ coach: () => showCoach(true), q1: () => openQ1(S.focus, 'panel'), picks: () => { resetQuick(); toast('Quick action picks reset'); }, copylog: () => copyJSON(LOG), reset: () => resetCharts() })[d.dataset.d]();
  });
  bindPayoffDev(dev);
  dev.addEventListener('change', e => { const t = e.target.dataset.t; if (!t) return; S[t] = e.target.checked; if (t === 'touches') app.classList.toggle('touches', S.touches); });
}
function syncDev() {
  const dev = $('#dev'); if (!dev) return;
  $$('#frames button', dev).forEach(b => b.classList.toggle('on', b.dataset.f === S.frame));
  $$('#qas button', dev).forEach(b => b.classList.toggle('on', b.dataset.qa === S.qa));
  $$('#lfs button', dev).forEach(b => b.classList.toggle('on', +b.dataset.fs === S.fs));
  $$('input[data-t]', dev).forEach(i => { i.checked = !!S[i.dataset.t]; });
}
function syncDevHints() {}
function renderLog() {
  const el = $('#log'); if (!el) return;
  el.innerHTML = LOG.slice(-40).reverse().map(e => { const { t, event, ...rest } = e; const cls = event === 'commit' ? 'commit' : event === 'cancel' ? 'cancel' : ''; return `<li class="${cls}"><b>${event}</b> ${Object.entries(rest).map(([k, x]) => `${k}=${x}`).join(' ')}</li>`; }).join('') || '<li>No events yet. Hold a timeframe button.</li>';
}

/* =========================================================================
   Layout, fit, init
   ========================================================================= */
function relayout() {
  computeLayout(); placeChrome(); redraw(); renderOrderPanel(); renderPayoffUI();
  requestAnimationFrame(() => { drawChart('idx'); drawChart('opt'); });
  fit();
}
function fit() {
  const dv = $('#device'), wrap = $('#devwrap'); if (!dv || isNative()) return;
  const f = FRAMES[S.frame], s = Math.min(1, (window.innerHeight - 40) / (f.h + 18));
  dv.style.transform = `scale(${s})`; wrap.style.width = (f.w + 18) * s + 'px'; wrap.style.height = (f.h + 18) * s + 'px';
}
function clock() { const d = new Date(), t = [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, '0')).join(':'); const el = $('.tp.clock'); if (el) el.textContent = t; }
window.addEventListener('resize', () => { relayout(); });
async function init() {
  const q = new URLSearchParams(location.search);
  if (FRAMES[q.get('frame')]) S.frame = q.get('frame');
  if (q.get('touches') === '1') { S.touches = true; app.classList.add('touches'); }
  S.qa = ['list', 'pills', 'pills3'].includes(q.get('qa')) ? q.get('qa') : store.get('qa2', 'pills3');   // the quick action panel's layout
  if (SCEN[q.get('pos')]) PM.scenario = q.get('pos');
  if (q.get('product') === 'intraday') PM.product = 'INTRADAY';
  if (q.get('later') === '1') PM.later = true;
  S.box = ['a', 'b', 'c', '0'].includes(q.get('box')) ? q.get('box') : store.get('box', 'a');   // which payoff box: three takes, or 0 for the one before
  S.ux = q.get('ux') === 'a' ? 'a' : 'b';   // b: the improved Payoff (UX-01, UX-02, UX-05); a: PRD v1.0 as first built
  const qc = q.get('clock'); if (qc) { const m = /^(\d{1,2}):?(\d{2})$/.exec(qc); if (m) MK.mod = clamp(+m[1] * 60 + +m[2], 555, 960); }
  E.calibrate(MK.nowT());
  buildCards(); bindChrome(); bindPayoff(); buildDev();
  applyScenario(PM.scenario); quotes(); updateHeaders(); updatePnlPill();
  if (['delayed', 'unavailable', 'offline'].includes(q.get('pricing'))) setPricing(q.get('pricing'));
  const qt = +q.get('text');
  rebuildSlots(); setTextSize(qt ? qt / 100 : 1, { silent: true });
  computeLayout(); placeChrome(); fit(); syncDev();
  try { await Promise.race([Promise.all(['400 11.3px RobotoQW', '400 12.5px RobotoQW', '400 14px InterQW', '500 14px InterQW', '600 18px InterQW'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 1500))]); } catch {}
  S.fontsReady = true; redraw(); requestAnimationFrame(frame);
  clockPill();
  renderLog();
  if (q.get('coach') !== '0') setTimeout(() => showCoach(), 700);
  else if (q.get('tip') !== '0') setTimeout(() => showPayoffTip(), 600);
  if (q.get('payoff') === '1') setTimeout(() => setPayoff(true, { source: 'link' }), 300);
  syncPayoffDev();
}
init();

function payoffDevHTML() {
  const groups = {}; Object.entries(SCEN).forEach(([k, s]) => (groups[s.group] = groups[s.group] || []).push([k, s.name]));
  return `<label class="pdl">Positions<select data-pd="scen">${Object.entries(groups).map(([g, items]) => `<optgroup label="${g}">${items.map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</optgroup>`).join('')}</select></label>
    <div class="seg pseg" data-pd="product"><button data-v="CARRY">Carry forward</button><button data-v="INTRADAY">Intraday</button></div>
    <label class="pdl">Clock<select data-pd="clock">${CLOCKS.map(([m, n]) => `<option value="${m}">${n}</option>`).join('')}</select></label>
    <div class="seg pseg" data-pd="pricing"><button data-v="live">Live</button><button data-v="delayed">Delayed</button><button data-v="offline">Offline</button><button data-v="unavailable">Unavailable</button></div>
    <div class="pdrow"><button class="dbtn pri" data-pa="toggle">Payoff on</button><button class="dbtn" data-pa="tip">Show the tip</button><button class="dbtn" data-pa="order">Order panel</button></div>
    <label class="dt pdt">Improved Payoff: breakevens in view, plain readout, header button<input type="checkbox" data-pt="ux"></label>
    <div class="pdl pdb">Payoff box</div><div class="seg pseg" data-pd="box"><button data-v="a">P&amp;L first</button><button data-v="b">Two rows</button><button data-v="c">At the point</button><button data-v="0">Before</button></div>
    <label class="dt pdt">Later release: order actions in the point sheet<input type="checkbox" data-pt="later"></label>
    <label class="dt pdt">Orders fail (Later release)<input type="checkbox" data-pt="fail"></label>
    <div class="pnote">Real 1-minute Kite data for NIFTY 50 and the 19 Oct 22500 Call and Put up to 12:59 pm on Wed 14 Oct 2026; later times simulated, other contracts modelled.</div>`;
}
function syncPayoffDev() {
  $$('[data-pd="scen"]').forEach(s => s.value = PM.scenario);
  $$('[data-pd="clock"]').forEach(s => s.value = String(MK.mod));
  $$('[data-pd="product"] button').forEach(b => { b.classList.toggle('on', b.dataset.v === PM.product); b.disabled = !SCEN[PM.scenario].product; });
  $$('[data-pd="pricing"] button').forEach(b => b.classList.toggle('on', b.dataset.v === MK.pricing));
  $$('[data-pa="toggle"]').forEach(b => b.textContent = PM.on ? 'Payoff off' : 'Payoff on');
  $$('[data-pd="box"] button').forEach(b => { b.classList.toggle('on', b.dataset.v === S.box); b.disabled = !uxB(); });
  $$('[data-pt="later"]').forEach(c => c.checked = PM.later);
  $$('[data-pt="ux"]').forEach(c => c.checked = S.ux !== 'a');
  $$('[data-pt="fail"]').forEach(c => c.checked = PM.orderFail);
}
function bindPayoffDev(root, closeMenu) {
  root.addEventListener('change', e => {
    const k = e.target.dataset.pd, tk = e.target.dataset.pt;
    if (k === 'scen') { PM.product = 'CARRY'; applyScenario(e.target.value); track('demo_positions', { scenario: e.target.value }); }
    else if (k === 'clock') { setClock(+e.target.value); track('demo_clock', { clock: +e.target.value }); }
    else if (tk === 'later') { PM.later = e.target.checked; store.set('later', PM.later); renderPayoffUI(); }
    else if (tk === 'fail') PM.orderFail = e.target.checked;
    else if (tk === 'ux') { const on = PM.on; if (on) setPayoff(false, { source: 'demo' }); S.ux = e.target.checked ? 'b' : 'a'; renderPayoffUI(); if (on) setPayoff(true, { source: 'demo' }); track('demo_ux', { ux: S.ux }); }
    else return;
    syncPayoffDev();
  });
  root.addEventListener('click', e => {
    const sb = e.target.closest('[data-pd] button'); if (sb && !sb.disabled) {
      const k = sb.closest('[data-pd]').dataset.pd;
      if (k === 'product') { PM.product = sb.dataset.v; applyScenario(PM.scenario); }
      if (k === 'pricing') setPricing(sb.dataset.v);
      if (k === 'box') { S.box = sb.dataset.v; store.set('box', S.box); renderPayoffUI(); track('demo_box', { box: S.box }); }
      syncPayoffDev(); return;
    }
    const a = e.target.closest('[data-pa]'); if (!a) return;
    if (closeMenu) closeMenu();
    setTimeout(() => {
      if (a.dataset.pa === 'toggle') setPayoff(!PM.on, { source: 'demo' });
      if (a.dataset.pa === 'tip') { PM.tipSeen = false; PM.hintSeen = false; store.set('tipSeen', false); store.set('hintSeen', false); if (PM.on) setPayoff(false, { source: 'demo' }); showPayoffTip(true); }
      if (a.dataset.pa === 'order') { if (S.order) closeOrderPanel(); else openOrderPanel(); }
      syncPayoffDev();
    }, closeMenu ? 280 : 0);
  });
  syncPayoffDev();
}
